services:
  db:
    image: mysql:8.0.46
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: trip_planner
      MYSQL_USER: trip_planner
      MYSQL_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in .env}
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost --silent"]
      interval: 10s
      timeout: 5s
      retries: 15
    networks: [backend]
  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_URL: jdbc:mysql://db:3306/trip_planner?connectionTimeZone=UTC&sslMode=PREFERRED
      DB_USER: trip_planner
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD}
      ADMIN_EMAIL: ${ADMIN_EMAIL:?Set ADMIN_EMAIL}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Set ADMIN_PASSWORD}
      TZ: Asia/Kolkata
      JAVA_OPTS: -Xms128m -Xmx512m -Djava.awt.headless=true
    ports: ["127.0.0.1:8080:8080"]
    networks: [backend]
volumes:
  mysql_data:
networks:
  backend:
