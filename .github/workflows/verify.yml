name: Verify Trip Planner
on: [push, pull_request]
jobs:
  java-and-mysql:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0.46
        env:
          MYSQL_DATABASE: trip_planner_test
          MYSQL_ROOT_PASSWORD: ci-test-only-password
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping --silent"
          --health-interval=10s --health-timeout=5s --health-retries=10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify UI regression behavior
        run: node --test src/test/js/ui.test.cjs
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - run: mvn -B verify
      - run: mvn -B test -DTEST_DB_URL=jdbc:mysql://127.0.0.1:3306/trip_planner_test -DTEST_DB_USER=root -DTEST_DB_PASSWORD=ci-test-only-password
      - uses: actions/upload-artifact@v4
        with:
          name: trip-planner-war
          path: target/trip-planner.war
